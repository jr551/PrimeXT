# Optional browser build. Generated with AI (Cursor).
# Started only by hand, so it does not run on other pull requests
# and does not sit next to nightly-builds as a required check.
name: wasm

on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl unzip python3

      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install 3.1.74
          ./emsdk/emsdk activate 3.1.74

      - name: Build web bundle
        run: |
          source emsdk/emsdk_env.sh
          chmod +x scripts/*.sh
          ./scripts/build-web.sh

      - name: Playwright
        working-directory: web
        run: |
          npm run test:e2e:install
          npm run test:e2e

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primext-engine-screenshot
          path: web/test-results/primext-engine.png
          if-no-files-found: warn
